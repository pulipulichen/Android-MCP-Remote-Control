name: Android test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: mobiletunnel/go.mod

      - name: Accept Android SDK licenses and install build packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build embedded OpenAI Tunnel SDK AAR
        working-directory: mobiletunnel
        run: |
          go mod tidy
          go list golang.org/x/mobile/bind
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -v -target=android/arm64 -androidapi 26 -javapkg go -o ../app/libs/mobiletunnel.aar .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Calculate APK checksum
        working-directory: app/build/outputs/apk/debug
        run: sha256sum app-debug.apk > SHA256SUMS.txt

      - name: Upload short-lived device-test APK
        uses: actions/upload-artifact@v4
        with:
          name: android-mcp-remote-control-poc-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 3
